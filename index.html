<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoutubAlMuslim</title>
  <meta name="description" content="Islamic Knowledge Hub — 6 major topics, 227+ curated videos, 11 languages. YouTube-exact UI with search, filters, and bookmarks.">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="yt-masthead">
    <div class="yt-masthead-start">
      <button class="yt-btn-icon" id="sidebarToggle" aria-label="Guide">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a href="#" class="yt-logo-link" onclick="showHome(); return false;">
        <div class="yt-logo">
          <svg viewBox="0 0 90 20" width="90" height="20"><rect x="0" y="1" width="28" height="18" rx="4" fill="#FF0000"/><polygon points="11,5 11,15 21,10" fill="#fff"/><text x="32" y="15" fill="currentColor" font-size="14" font-weight="700" font-family="Arial,sans-serif">YoutubAlMuslim</text></svg>
        </div>
      </a>
    </div>

    <div class="yt-masthead-center">
      <div class="yt-search-container">
        <div class="yt-searchbox">
          <input id="searchInput" class="yt-searchbox-input" placeholder="Search" type="text" autocomplete="off">
          <button id="searchBtn" class="yt-searchbox-button" aria-label="Search">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="yt-masthead-end">
      <button class="yt-btn-icon" id="randomBtn" title="Inspire Me">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="yt-btn-icon" id="bookmarksBtn" title="Bookmarks">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <button class="yt-btn-icon" id="themeToggle" title="Appearance">
        <svg id="themeIconDark" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        <svg id="themeIconLight" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      </button>
      <div class="yt-avatar" title="You">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="yt-guide" id="sidebar">
    <div class="yt-guide-inner">
      <nav class="yt-guide-section">
        <a href="#" class="yt-guide-item yt-guide-item--active" data-view="home" onclick="showHome(); return false;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M4 21V10.08l8-6.96 8 6.96V21h-6v-6h-4v6H4z"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="yt-guide-item" data-view="bookmarks" onclick="showBookmarks(); return false;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Bookmarks</span>
        </a>
        <a href="#" class="yt-guide-item" onclick="randomVideo(); return false;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          <span>Inspire Me</span>
        </a>
      </nav>
      <div class="yt-guide-divider"></div>
      <div class="yt-guide-section">
        <div class="yt-guide-heading">SUBSCRIPTIONS</div>
        <div id="sidebarTopics"></div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="yt-body" id="mainContent">
    <div id="homeView">
      <!-- CHIPS -->
      <div class="yt-chip-bar" id="chipsBar">
        <button class="yt-chip yt-chip--active" data-topic-id="all">All</button>
      </div>
      <div class="yt-chip-bar yt-chip-bar--sub" id="subtopicChips" style="display:none;"></div>
      <div class="yt-chip-bar yt-chip-bar--lang" id="langChips"></div>
      <!-- GRID -->
      <div class="yt-grid" id="videoGrid"></div>
      <div class="yt-alert" id="noResults" style="display:none;">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="#606060"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <div class="yt-alert-title">No results found</div>
        <div class="yt-alert-sub">Try different keywords or remove search filters</div>
      </div>

    </div>
    <div id="bookmarksView" style="display:none;">
      <div class="yt-page-header"><h1>Bookmarks</h1><span id="bookmarkCount" class="yt-page-header-sub"></span></div>
      <div class="yt-grid" id="bookmarksGrid"></div>
      <div class="yt-alert" id="noBookmarks" style="display:none;">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="#606060"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        <div class="yt-alert-title">No bookmarks yet</div>
        <div class="yt-alert-sub">Save videos to watch later</div>
      </div>
    </div>
  </div>

  <!-- WATCH PAGE (YouTube-style two-column) -->
  <div class="yt-watch-overlay" id="videoModal" style="display:none;">
    <div class="yt-watch-backdrop" onclick="closeModal()"></div>
    <div class="yt-watch-container">
      <button class="yt-watch-close" onclick="closeModal()" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <div class="yt-watch-body">
        <!-- LEFT: Player + Info -->
        <div class="yt-watch-primary">
          <div class="yt-player">
            <div id="modalPlayer" class="yt-player-theatre"></div>
          </div>
          <div class="yt-watch-metadata">
            <h1 id="modalTitle" class="yt-watch-title"></h1>
            <div class="yt-watch-actions">
              <div class="yt-watch-channel-info">
                <div class="yt-watch-avatar" id="modalAvatar"></div>
                <div>
                  <div id="modalSpeaker" class="yt-watch-channel-name"></div>
                  <div class="yt-watch-channel-subs"></div>
                </div>
              </div>
              <div class="yt-watch-buttons">
                <button id="modalBookmark" class="yt-watch-btn yt-watch-btn--save" onclick="toggleBookmarkFromModal()">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                  <span>Save</span>
                </button>
              </div>
            </div>
            <div class="yt-watch-info-box">
              <div id="modalMeta" class="yt-watch-meta"></div>
              <div id="modalTags" class="yt-watch-tags"></div>
            </div>
          </div>
        </div>
        <!-- RIGHT: Related -->
        <div class="yt-watch-secondary">
          <div id="modalRelated" class="yt-watch-related"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
