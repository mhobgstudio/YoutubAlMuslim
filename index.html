<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoutubAlMuslim — Islamic Knowledge Hub</title>
  <meta name="description" content="Complete Islamic knowledge database — 33 topics, 170+ curated videos, 11 languages. Search by topic, difficulty, and language.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== YOUTUBE-STYLE HEADER ===== -->
  <header class="yt-header">
    <div class="yt-header-left">
      <button class="yt-hamburger" id="sidebarToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a href="#" class="yt-logo" onclick="showHome(); return false;">
        <svg viewBox="0 0 90 20" width="90" height="20">
          <rect x="0" y="2" width="28" height="16" rx="4" fill="#FF0000"/>
          <polygon points="11,6 11,14 20,10" fill="#fff"/>
          <text x="32" y="16" fill="currentColor" font-size="14" font-weight="700" font-family="Arial,sans-serif">YoutubAlMuslim</text>
        </svg>
      </a>
    </div>

    <div class="yt-header-center">
      <form class="yt-search" onsubmit="return false;">
        <input type="text" id="searchInput" class="yt-search-input" placeholder="Search" autocomplete="off">
        <button type="button" id="searchBtn" class="yt-search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
    </div>

    <div class="yt-header-right">
      <button class="yt-icon-btn" id="randomBtn" title="Random video">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="yt-icon-btn" id="bookmarksBtn" title="Bookmarks">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <button class="yt-icon-btn" id="themeToggle" title="Toggle theme">
        <svg id="themeIconDark" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        <svg id="themeIconLight" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== YOUTUBE-STYLE SIDEBAR ===== -->
  <aside class="yt-sidebar" id="sidebar">
    <nav class="yt-sidebar-nav">
      <a href="#" class="yt-sidebar-item active" data-view="home" onclick="showHome(); return false;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="yt-sidebar-item" data-view="bookmarks" onclick="showBookmarks(); return false;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        <span>Bookmarks</span>
      </a>
      <a href="#" class="yt-sidebar-item" id="randomSidebar" onclick="randomVideo(); return false;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        <span>Inspire Me</span>
      </a>
      <div class="yt-sidebar-divider"></div>
      <div class="yt-sidebar-heading">SUBSCRIPTIONS</div>
      <div id="sidebarTopics"></div>
    </nav>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="yt-main" id="mainContent">

    <!-- HOME VIEW -->
    <div id="homeView">
      <!-- Category Chips Bar (YouTube-style) -->
      <div class="yt-chips-bar" id="chipsBar">
        <button class="yt-chip active" data-topic-id="all">All</button>
      </div>

      <!-- Subtopic Chips -->
      <div class="yt-chips-bar yt-subchips" id="subtopicChips" style="display:none;"></div>

      <!-- Video Grid -->
      <div class="yt-grid" id="videoGrid"></div>

      <!-- No Results -->
      <div class="yt-no-results" id="noResults" style="display:none;">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="#606060"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <h3>No results found</h3>
        <p>Try different keywords or remove search filters</p>
      </div>

      <!-- Load More -->
      <div class="yt-load-more" id="loadMore" style="display:none;">
        <button id="loadMoreBtn" class="yt-load-more-btn">Load more</button>
      </div>
    </div>

    <!-- BOOKMARKS VIEW -->
    <div id="bookmarksView" style="display:none;">
      <div class="yt-section-header">
        <h2>Bookmarks</h2>
        <p class="yt-section-sub" id="bookmarkCount"></p>
      </div>
      <div class="yt-grid" id="bookmarksGrid"></div>
      <div class="yt-no-results" id="noBookmarks" style="display:none;">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="#606060"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        <h3>No bookmarks yet</h3>
        <p>Save videos to watch later</p>
      </div>
    </div>
  </main>

  <!-- ===== VIDEO PLAYER MODAL (YouTube-style) ===== -->
  <div class="yt-player-overlay" id="videoModal" style="display:none;">
    <div class="yt-player-backdrop" onclick="closeModal()"></div>
    <div class="yt-player-container">
      <button class="yt-player-close" onclick="closeModal()" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <div class="yt-player-wrapper">
        <div id="modalPlayer" class="yt-player-frame"></div>
      </div>
      <div class="yt-player-info">
        <h2 id="modalTitle" class="yt-player-title"></h2>
        <div class="yt-player-meta">
          <span id="modalSpeaker" class="yt-player-channel"></span>
          <span class="yt-meta-sep">•</span>
          <span id="modalDifficulty" class="yt-player-stat"></span>
          <span class="yt-meta-sep">•</span>
          <span id="modalLanguage" class="yt-player-stat"></span>
          <span class="yt-meta-sep">•</span>
          <span id="modalDuration" class="yt-player-stat"></span>
        </div>
        <div id="modalTags" class="yt-player-tags"></div>
        <button id="modalBookmark" class="yt-player-bookmark" onclick="toggleBookmarkFromModal()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Save</span>
        </button>
      </div>
      <div class="yt-player-related">
        <h3>Related</h3>
        <div id="modalRelated" class="yt-related-list"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
