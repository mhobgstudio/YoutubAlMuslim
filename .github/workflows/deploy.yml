name: Validate & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: test -f index.html && echo "✅ index.html" || exit 1

      - name: Validate service worker
        run: node --check sw.js && echo "✅ sw.js valid" || exit 1

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))" && echo "✅ manifest.json" || exit 1

      - name: Validate app.js syntax
        run: node --check app.js && echo "✅ app.js valid" || exit 1

      - name: Check data file
        run: test -f data/topics.json && echo "✅ topics.json" || echo "⚠️ topics.json missing"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          # Copy only the files needed for the site
          cp index.html app.js style.css offline.html sw.js manifest.json ./ 2>/dev/null
          cp -r data audio assets ./ 2>/dev/null
          git add -A
          git commit -m "Deploy to GitHub Pages"
          git push -f origin gh-pages
