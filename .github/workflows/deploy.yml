name: Validate & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate HTML
        run: test -f index.html && echo "✅ index.html" || exit 1

      - name: Validate service worker
        run: node --check sw.js && echo "✅ sw.js valid" || exit 1

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))" && echo "✅ manifest.json" || exit 1

      - name: Validate app.js syntax
        run: node --check app.js && echo "✅ app.js valid" || exit 1

      - name: Validate data file
        run: node -e "JSON.parse(require('fs').readFileSync('data/topics.json','utf8'))" && echo "✅ topics.json valid" || exit 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          exclude_assets: |
            .claude/
            .git/
            tests/
            node_modules/
